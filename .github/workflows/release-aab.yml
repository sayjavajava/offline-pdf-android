name: Signed release AAB

# Manual only. This is the Play Store path: Play requires an Android App
# Bundle upload for new apps, not an APK -- separate from release-apk.yml,
# which produces the .apk you'd hand a tester to sideload directly (an .aab
# isn't directly installable; Play itself splits it into device-specific
# APKs at install time). Same signing keystore as that workflow: the key
# that signs this .aab becomes your Play Console "upload key" once you opt
# into Play App Signing, which every new app is enrolled in by default.
#
# The .aab is published to a GitHub Release, same v<versionName> tag
# release-apk.yml uses -- see that workflow's header comment for why a
# Release rather than only this run's own (expiring) artifact, and for how
# the two workflows share one tag without conflicting.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The tag and Release name both come from versionName, the one place
      # this app's version is already declared -- not re-typed here, so the
      # two can never drift apart.
      - name: Read the app version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts."
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      # Checked first, before any of the expensive build steps below: a
      # re-run that already has this exact asset on this version's Release
      # almost always means someone forgot to bump versionName, and this
      # fails loudly on that rather than silently overwrite it. Asset-aware,
      # not just tag-aware -- release-apk.yml may have already created this
      # same tag's Release for the .apk, which is not a conflict, only a
      # second app-release.aab on it would be.
      #
      # One thing this check cannot catch: Play Console's own rule that a
      # versionCode, once uploaded to any track, can never be reused, even
      # if you never publish that track. Bump versionCode in
      # app/build.gradle.kts every time you bump versionName -- this
      # workflow only knows about versionName, since that's what names the
      # tag; it does not read or validate versionCode.
      - name: Refuse to overwrite an existing release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(curl -s -o "$RUNNER_TEMP/release.json" -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.tag }}")
          if [ "$STATUS" = "200" ]; then
            if jq -e '.assets[] | select(.name == "app-release.aab")' "$RUNNER_TEMP/release.json" > /dev/null; then
              echo "::error::Release ${{ steps.version.outputs.tag }} already has app-release.aab attached -- bump versionName (and versionCode) in app/build.gradle.kts before running this again."
              exit 1
            fi
            echo "Release ${{ steps.version.outputs.tag }} exists (from release-apk.yml, presumably) but has no app-release.aab yet -- proceeding to add it."
          elif [ "$STATUS" = "404" ]; then
            echo "No release ${{ steps.version.outputs.tag }} yet -- this run will create it."
          else
            echo "::error::Unexpected GitHub API status $STATUS checking for an existing release."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # Same secret, same reasoning as release-apk.yml: never committed, and
      # these four values are the only things that need protecting.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OFFGRID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::OFFGRID_KEYSTORE_BASE64 is not set. See README.md, 'Building a signed release APK', for how to create the keystore and add the four secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release AAB
        env:
          OFFGRID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          OFFGRID_KEYSTORE_PASSWORD: ${{ secrets.OFFGRID_KEYSTORE_PASSWORD }}
          OFFGRID_KEY_ALIAS: ${{ secrets.OFFGRID_KEY_ALIAS }}
          OFFGRID_KEY_PASSWORD: ${{ secrets.OFFGRID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      # An .aab isn't a signed zip the way an APK is (no v2/v3 apksigner
      # scheme) -- Gradle signs it with a jarsigner-style signature instead,
      # which is what Play checks against your upload key. jarsigner (part
      # of the same JDK setup-java already installed) verifies that.
      #
      # No separate "not debuggable" / "no INTERNET permission" check here,
      # unlike release-apk.yml: both come from the identical `release`
      # buildType block and the identical merged manifest that
      # assembleRelease uses -- AGP builds the .apk and .aab from the same
      # module config, not two separately-configured outputs, so there is
      # nothing AAB-specific that could make either guarantee differ. Doing
      # the equivalent check for real would mean pulling in bundletool to
      # decode the .aab's binary manifest (aapt2 only reads APKs), which
      # is extra CI surface for a check the sibling workflow has already
      # made on output from the same source.
      - name: Verify the AAB is really signed
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs "$AAB"
          echo "✓ Signed."

      - name: Upload the signed AAB as this run's own artifact
        uses: actions/upload-artifact@v7
        with:
          name: offgridpdf-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Same durable-Release reasoning as release-apk.yml. If that workflow
      # already created this tag's Release (with the .apk attached), this
      # action updates the existing Release with the .aab rather than
      # erroring or replacing it -- the asset-aware check above is what
      # actually guards against a genuine double-run, not this step.
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OffGridPDF ${{ steps.version.outputs.name }}
          files: app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
