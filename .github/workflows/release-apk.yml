name: Signed release APK

# Manual only. This is how a build gets handed to a tester: it produces one
# signed, non-debuggable APK that installs over the previous one, instead of
# the debug APK from ci.yml, which is signed with a throwaway key the runner
# regenerates every time and so forces an uninstall on every update.
#
# The APK is published to a GitHub Release, not just this run's own artifact
# (kept below too, for convenience): an Actions artifact expires (90 days,
# this repo's default) and needs repo-Actions-tab access to find; a Release
# has a stable URL and shows up in the repo's own Releases list. The tag is
# v<versionName> from app/build.gradle.kts, so bump versionName there before
# running this again for a new build -- see "Refuse to overwrite" below.
#
# This tag is shared with release-aab.yml (same v<versionName> scheme, same
# Release): whichever of the two you run first creates it, the other adds
# its own asset alongside. The overwrite check below is asset-aware for
# exactly that reason -- it only refuses when *this* workflow's own asset
# (app-release.apk) is already on the release for this version, not merely
# because the release/tag exists (the sibling workflow may have created it
# first, with nothing to conflict with yet).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The tag and Release name both come from versionName, the one place
      # this app's version is already declared -- not re-typed here, so the
      # two can never drift apart.
      - name: Read the app version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts."
            exit 1
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      # Checked first, before any of the expensive build steps below: a
      # re-run that already has this exact asset on this version's Release
      # almost always means someone forgot to bump versionName, and this
      # fails loudly on that rather than silently overwrite it -- same
      # instinct as the unsigned-APK and offline-permission checks further
      # down, just moved to the front so the mistake doesn't cost a full
      # build first. Asset-aware, not just tag-aware -- see the header
      # comment on why a bare "does the tag exist" check would wrongly
      # block this workflow running after release-aab.yml for the same
      # version.
      - name: Refuse to overwrite an existing release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(curl -s -o "$RUNNER_TEMP/release.json" -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.tag }}")
          if [ "$STATUS" = "200" ]; then
            if jq -e '.assets[] | select(.name == "app-release.apk")' "$RUNNER_TEMP/release.json" > /dev/null; then
              echo "::error::Release ${{ steps.version.outputs.tag }} already has app-release.apk attached -- bump versionName in app/build.gradle.kts before running this again."
              exit 1
            fi
            echo "Release ${{ steps.version.outputs.tag }} exists (from release-aab.yml, presumably) but has no app-release.apk yet -- proceeding to add it."
          elif [ "$STATUS" = "404" ]; then
            echo "No release ${{ steps.version.outputs.tag }} yet -- this run will create it."
          else
            echo "::error::Unexpected GitHub API status $STATUS checking for an existing release."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      # The keystore lives in a secret as base64 and is written to a file the
      # runner throws away with itself. It is never committed, and the four
      # values below are the only things that need protecting -- losing them
      # means no further updates can be shipped to anyone who installed this.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OFFGRID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::OFFGRID_KEYSTORE_BASE64 is not set. See README.md, 'Building a signed release APK', for how to create the keystore and add the four secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          OFFGRID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          OFFGRID_KEYSTORE_PASSWORD: ${{ secrets.OFFGRID_KEYSTORE_PASSWORD }}
          OFFGRID_KEY_ALIAS: ${{ secrets.OFFGRID_KEY_ALIAS }}
          OFFGRID_KEY_PASSWORD: ${{ secrets.OFFGRID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # Belt and braces. A release APK that turned out to be unsigned would
      # simply refuse to install on a tester's phone, and finding that out
      # from them rather than from CI wastes everyone's time.
      - name: Verify the APK is really signed, and not debuggable
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          if "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -qi "application-debuggable"; then
            echo "::error::The release APK is debuggable. It must not be."
            exit 1
          fi
          echo "✓ Signed, and not debuggable."

      # Same offline guarantee ci.yml enforces for debug, checked again on the
      # artifact that actually reaches a person's phone.
      - name: Offline guarantee — no INTERNET permission in the release APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          if "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -q "android.permission.INTERNET"; then
            echo "::error::INTERNET permission found in the release APK."
            exit 1
          fi
          echo "✓ No INTERNET permission."

      - name: Upload the signed APK as this run's own artifact
        uses: actions/upload-artifact@v7
        with:
          name: offgridpdf-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # The durable copy: a GitHub Release, tagged and named from versionName
      # (read above), with the APK attached as a release asset. This is what
      # gives testers a stable link instead of an expiring Actions artifact.
      # If release-aab.yml already created this tag's Release (for the same
      # version, with the .aab attached), this action updates that existing
      # Release with the APK rather than erroring or replacing it -- the
      # asset-aware check above is what actually guards against a genuine
      # double-run, not this step.
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OffGridPDF ${{ steps.version.outputs.name }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
