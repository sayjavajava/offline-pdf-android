# Version catalog — every dependency pinned to an exact version, none
# left floating. Bumping a version here is its own PR (mirrors the
# sibling web repo's package-lock.json discipline: dependency bumps are
# reviewed and CI-verified on their own, never folded into a feature PR).
[versions]
agp = "9.2.0"
kotlin = "2.4.0"
composeBom = "2026.08.00"
coreKtx = "1.15.0"
lifecycleRuntimeKtx = "2.9.0"
activityCompose = "1.10.0"
navigationCompose = "2.9.7"
# 2.0.27.0 is the newest published version of the tom-roush port (checked
# against Maven Central, not assumed) — there is nothing to bump to, even
# though upstream Apache PDFBox has moved past the 2.0.27 baseline this
# wraps. Worth knowing when weighing anything that feeds it untrusted
# input: this parser will not receive fixes, so the guards around it
# matter more than they otherwise would.
pdfboxAndroid = "2.0.27.0"
# 1.84, and specifically not 1.85: at 1.85 bcprov and bcutil both ship
# org.bouncycastle.asn1.iana.IANAObjectIdentifiers, which AGP's duplicate-
# class check rejects outright ("Duplicate class ... found in modules
# bcprov-jdk15to18-1.85.jar and bcutil-jdk15to18-1.85.jar"). Confirmed by
# downloading the real jars for 1.78 through 1.85 and diffing their class
# lists: exactly one class overlaps, and only at 1.85. 1.84 is the newest
# release where all three artifacts are disjoint.
#
# Was 1.72 (2022), which is affected by CVE-2023-33201 and CVE-2023-33202
# (fixed in 1.73) and CVE-2024-29857, CVE-2024-30171 and CVE-2024-30172
# (fixed in 1.78). Not a dormant dependency: bcprov sits behind PdfBox's
# encrypted-PDF path, so it parses bytes that came from a file the user
# did not necessarily write.
bouncyCastle = "1.84"
junit = "4.13.2"
kotlinxCoroutines = "1.11.0"
# Spike B (ANDROID_IMPLEMENTATION_PLAN.md, tool-docs repo) only — not yet
# used by any shipped tool. Pinned to the latest stable tag (REL_5_5_1 on
# GitHub) at spike time.
apachePoiOoxml = "5.5.1"
# Spike B, comparison approach only: kxml2 is the same XmlPullParser
# implementation Android's own android.util.Xml.newPullParser() wraps,
# but usable standalone under plain JUnit (android.util.Xml itself is an
# Android-framework class not available there). Long-stable, unchanged
# for years -- this exact version already ships inside the Android
# platform itself.
kxml2 = "2.3.0"
# Spike A (page rendering, ANDROID_IMPLEMENTATION_PLAN.md, tool-docs repo)
# only -- instrumented (androidTest) dependencies, needed to run real
# android.graphics.pdf.PdfRenderer/PDFRenderer comparisons on an actual
# device/emulator, which no plain JUnit test can reach.
androidxTestCore = "1.6.1"
androidxTestRunner = "1.6.2"
androidxTestExtJunit = "1.2.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
# -extended, not -core: guarantees any real Material icon name resolves
# (it has a transitive dependency on -core) instead of needing to guess
# which handful of icons the small "core" subset actually bundles.
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfboxAndroid" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk15to18", version.ref = "bouncyCastle" }
bouncycastle-bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk15to18", version.ref = "bouncyCastle" }
bouncycastle-bcutil = { group = "org.bouncycastle", name = "bcutil-jdk15to18", version.ref = "bouncyCastle" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
apache-poi-ooxml = { group = "org.apache.poi", name = "poi-ooxml", version.ref = "apachePoiOoxml" }
kxml2 = { group = "net.sf.kxml", name = "kxml2", version.ref = "kxml2" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No kotlin-android entry: AGP 9.0+ compiles Kotlin itself ("built-in
# Kotlin") and rejects org.jetbrains.kotlin.android as a conflict if
# applied alongside it. kotlin-compose (the Compose *compiler* plugin,
# a separate concern) is still required.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
